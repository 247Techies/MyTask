:root[data-theme="dark"]{--board:#171d24;--dot:#2c3641;--frame:#39434e;--ink:#e8edf2;--mute:#92a1b2;--card:#222b35;--line:#334050;--col:#1f2832a8;--blue:#6f93ff;--p-urgent:#3a2326;--p-high:#3a3120;--p-med:#212f4a;--p-low:#1f3a2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--frame);color:var(--ink);font-family:Figtree,system-ui,sans-serif;margin:0;min-height:100vh;padding:10px}

.marker{font-family:Caveat,cursive;font-weight:700}
.col{background:var(--col);border:1.5px dashed var(--line);border-radius:12px;backdrop-filter:blur(2px)}
.note{background:var(--card);border-radius:6px;box-shadow:0 1px 2px #0002,0 4px 10px #0001;position:relative;cursor:grab;border-left:5px solid var(--c);transition:transform .15s}
.note:hover{transform:translateY(-2px)}
.note.sortable-ghost{opacity:.35}

<div class="board p-4 md:p-6">
  <header class="flex flex-wrap items-center gap-3 mb-4">
    <div class="mr-auto">
      <h1 class="marker text-4xl leading-none" style="color:var(--blue)">Request Board</h1>
      <p class="text-sm" style="color:var(--mute)" id="today"></p>
    </div>
    <input id="q" class="fld !w-48" placeholder="Search requests…" aria-label="Search">
    <select id="fp" class="fld !w-auto" aria-label="Filter priority"><option value="">All priorities</option><option>urgent</option><option>high</option><option>medium</option><option>low</option></select>
    <select id="sort" class="fld !w-auto" aria-label="Sort"><option value="manual">Manual order</option><option value="priority">By priority</option><option value="due">By due date</option></select>
    <button class="btn" id="theme" title="Toggle theme">◐</button>
    <button class="btn" id="exp">Export</button>
    <button class="btn" id="imp">Import</button><input type="file" id="file" accept=".json" hidden>
    <button class="btn pri" id="add">+ New request</button>
  </header>
  <div id="stats" class="flex flex-wrap gap-2 mb-4 text-sm"></div>
  <main class="cols" id="cols"></main>
</div>

<dialog id="dlg"><form method="dialog" id="f" class="p-5 grid grid-cols-2 gap-3">
  <h2 class="marker text-3xl col-span-2" id="dt">New request</h2>
  <label class="col-span-2"><span>Request title</span><input class="fld" id="title" required></label>
  <label><span>From (name or email)</span><input class="fld" id="from" placeholder="client@company.com"></label>
  <label><span>Email subject / reference</span><input class="fld" id="ref"></label>
  <label><span>Priority</span><select class="fld" id="priority"><option value="urgent">Urgent</option><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>
  <label><span>Status</span><select class="fld" id="status"></select></label>
  <label><span>Due date</span><input type="date" class="fld" id="date"></label>
  <label><span>Due time</span><input type="time" class="fld" id="time"></label>
  <label class="col-span-2"><span>Tags (comma separated)</span><input class="fld" id="tags" placeholder="billing, support"></label>
  <label class="col-span-2"><span>Notes</span><textarea class="fld" id="notes" rows="3"></textarea></label>
  <div class="col-span-2 flex gap-2 justify-between mt-1">
    <button type="button" class="btn" id="del" style="color:var(--s-urgent)">Delete</button>
    <div class="flex gap-2"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn pri" id="save" value="save">Save request</button></div>
  </div>
</form></dialog>

<script>
const STATUSES=[["inbox","Inbox","New requests to triage"],["progress","In progress","Being worked on"],["waiting","Waiting","Blocked on a reply"],["done","Done","Resolved"]];
const PR={urgent:0,high:1,medium:2,low:3};
const KEY="request-board-v1";
let tasks=[],editId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function dayStr(d,off=0){const x=new Date(d);x.setDate(x.getDate()+off);return x.toISOString().slice(0,10)}
function seed(){const n=new Date();return[
 {title:"Refund request for order #4821",from:"maria@northwind.com",ref:"Re: Refund for duplicate charge",priority:"urgent",status:"inbox",date:dayStr(n),time:"15:00",tags:"billing",notes:"Customer was charged twice. Check payment log."},
 {title:"Quote for annual support plan",from:"j.silva@acme.io",ref:"Pricing question",priority:"high",status:"progress",date:dayStr(n,2),time:"10:00",tags:"sales",notes:""},
 {title:"Update shipping address",from:"tom@brightco.lk",ref:"Address change",priority:"low",status:"waiting",date:dayStr(n,5),time:"",tags:"support",notes:"Waiting for confirmation of postal code."},
 {title:"Send onboarding documents",from:"hr@lakeview.org",ref:"Onboarding",priority:"medium",status:"done",date:dayStr(n,-1),time:"12:00",tags:"docs",notes:""}
].map((t,i)=>({...t,id:uid(),order:i,created:Date.now()}))}
function dueDate(t){return t.date?new Date(t.date+"T"+(t.time||"23:59")):null}
function dueInfo(t){const d=dueDate(t);if(!d)return null;
 const diff=d-Date.now(),over=diff<0&&t.status!=="done",soon=!over&&diff<864e5&&t.status!=="done";
 const lbl=d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+(t.time?" · "+t.time:"");
 return{lbl,cls:over?"over":soon?"soon":"",over}}
function visible(){const q=$("q").value.toLowerCase(),fp=$("fp").value;
 return tasks.filter(t=>(!fp||t.priority===fp)&&(!q||[t.title,t.from,t.ref,t.tags,t.notes].join(" ").toLowerCase().includes(q)))}
function sorter(){const m=$("sort").value;
 return(a,b)=>{if(m==="priority")return PR[a.priority]-PR[b.priority]||(dueDate(a)||1e15)-(dueDate(b)||1e15);
  if(m==="due")return(dueDate(a)||1e15)-(dueDate(b)||1e15)||PR[a.priority]-PR[b.priority];
  return a.order-b.order}}
function card(t){const di=dueInfo(t);
 const tags=(t.tags||"").split(",").map(s=>s.trim()).filter(Boolean).map(g=>`<span class="badge">#${esc(g)}</span>`).join("");
 return`<div class="note p-${t.priority} ${t.status==="done"?"done":""} p-3" data-id="${t.id}" tabindex="0">
 <div class="flex items-start justify-between gap-2"><div class="t font-semibold leading-snug">${esc(t.title)}</div>
 <span class="text-[11px] font-bold shrink-0" style="color:var(--c)">${t.priority}</span></div>
 ${t.from?`<div class="text-xs mt-1 truncate" style="color:var(--mute)">✉ ${esc(t.from)}</div>`:""}
 ${t.ref?`<div class="text-xs truncate" style="color:var(--mute)">${esc(t.ref)}</div>`:""}
 ${t.notes?`<div class="text-xs mt-2 line-clamp-2">${esc(t.notes)}</div>`:""}
 <div class="flex flex-wrap items-center gap-1.5 mt-2">${di?`<span class="badge ${di.cls}">${di.over?"Overdue · ":""}${di.lbl}</span>`:""}${tags}</div>
 <div class="mt-2 flex items-center gap-1.5"><select class="fld !py-1 !text-xs" data-st="${t.id}" aria-label="Change status">${STATUSES.map(s=>`<option value="${s[0]}" ${s[0]===t.status?"selected":""}>${s[1]}</option>`).join("")}</select>
 <button class="bin" data-del="${t.id}" title="Delete request" aria-label="Delete request"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div></div>`}
function render(){
 const list=visible().sort(sorter());
 $("cols").innerHTML=STATUSES.map(([k,n,h])=>{const items=list.filter(t=>t.status===k);
  return`<section class="col p-3 flex flex-col"><div class="flex items-baseline justify-between mb-3"><div><h2 class="marker text-2xl leading-none">${n}</h2><div class="text-xs" style="color:var(--mute)">${h}</div></div><span class="badge">${items.length}</span></div>
  <div class="lane flex flex-col gap-4 pt-2 flex-1 min-h-[120px]" data-st="${k}">${items.map(card).join("")||""}</div>
  <button class="btn mt-3 !text-xs" data-new="${k}">+ Add to ${n.toLowerCase()}</button></section>`}).join("");
 document.querySelectorAll(".lane").forEach(l=>new Sortable(l,{group:"b",animation:150,ghostClass:"sortable-ghost",delay:120,delayOnTouchOnly:true,
  onEnd(){document.querySelectorAll(".lane").forEach(ln=>[...ln.children].forEach((el,i)=>{const t=tasks.find(x=>x.id===el.dataset.id);if(t){t.status=ln.dataset.st;if($("sort").value==="manual")t.order=i}}));save();render()}}));
 const act=tasks.filter(t=>t.status!=="done"),od=act.filter(t=>dueInfo(t)?.over).length,td=act.filter(t=>t.date===dayStr(new Date())).length;
 $("stats").innerHTML=[["Open",act.length,""],["Due today",td,""],["Overdue",od,od?"over":""],["Done",tasks.length-act.length,""]].map(([a,b,c])=>`<span class="badge ${c} !text-sm !px-3 !py-1">${a}: ${b}</span>`).join("");
}
function open(t,status){editId=t?.id||null;$("dt").textContent=t?"Edit request":"New request";$("del").style.visibility=t?"visible":"hidden";
 $("status").innerHTML=STATUSES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
 const v=t||{title:"",from:"",ref:"",priority:"medium",status:status||"inbox",date:"",time:"",tags:"",notes:""};
 ["title","from","ref","priority","status","date","time","tags","notes"].forEach(k=>$(k).value=v[k]);$("dlg").showModal()}
$("f").addEventListener("submit",e=>{if(e.submitter?.value!=="save")return;
 const v={};["title","from","ref","priority","status","date","time","tags","notes"].forEach(k=>v[k]=$(k).value.trim());
 if(editId)Object.assign(tasks.find(t=>t.id===editId),v);else tasks.push({...v,id:uid(),order:Date.now(),created:Date.now()});
 save();render();toast("success",editId?"Request updated":"Request added")});
$("cancel").onclick=()=>$("dlg").close();
$("del").onclick=async()=>{const t=tasks.find(x=>x.id===editId);if(!t)return;$("dlg").close();if(!(await removeTask(t)))open(t)};
$("add").onclick=()=>open();
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const swal=o=>Swal.fire({background:cv("--card"),color:cv("--ink"),confirmButtonColor:cv("--blue"),cancelButtonColor:cv("--mute"),...o});
const toast=(icon,title)=>Swal.fire({toast:true,position:"top-end",icon,title,showConfirmButton:false,timer:2200,timerProgressBar:true,background:cv("--card"),color:cv("--ink")});
async function removeTask(t){
 const r=await swal({icon:"warning",title:"Delete this request?",html:`<b>${esc(t.title)}</b><br><span style="font-size:14px;color:${cv("--mute")}">This can't be undone.</span>`,showCancelButton:true,confirmButtonText:"Yes, delete it",cancelButtonText:"Keep it",confirmButtonColor:cv("--s-urgent"),focusCancel:true,reverseButtons:true});
 if(!r.isConfirmed)return false;
 tasks=tasks.filter(x=>x!==t);save();render();toast("success","Request deleted");return true}
$("cols").addEventListener("click",e=>{const d=e.target.closest("[data-del]");
 if(d){const t=tasks.find(x=>x.id===d.dataset.del);if(t)removeTask(t);return}
 const n=e.target.closest("[data-new]");if(n)return open(null,n.dataset.new);
 if(e.target.closest("select"))return;const c=e.target.closest(".note");if(c)open(tasks.find(t=>t.id===c.dataset.id))});
$("cols").addEventListener("change",e=>{const s=e.target.dataset.st;if(s&&e.target.tagName==="SELECT"){tasks.find(t=>t.id===s).status=e.target.value;save();render()}});
["q","fp","sort"].forEach(i=>$(i).addEventListener("input",render));
$("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"}));a.download="requests.json";a.click()};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;f.text().then(async x=>{let d;
 try{d=JSON.parse(x);if(!Array.isArray(d))throw 0}catch(_){return swal({icon:"error",title:"Can't import this file",text:"Choose a requests.json file exported from this board."})}
 const r=await swal({icon:"question",title:"Replace your current board?",text:`This loads ${d.length} request${d.length===1?"":"s"} and replaces the ${tasks.length} on the board now.`,showCancelButton:true,confirmButtonText:"Replace board",cancelButtonText:"Cancel",reverseButtons:true});
 if(r.isConfirmed){tasks=d;save();render();toast("success","Board imported")}})};
$("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
tasks=load()||seed();render();setInterval(render,60000);
</script>
</body>
</html>
